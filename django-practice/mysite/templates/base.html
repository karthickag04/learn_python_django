{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Django Practice
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'main:index' %}">
                Home
            </a>

            <a href="{% url 'accounts:login' %}">
                Login
            </a>

            <a href="{% url 'accounts:register' %}">
                Register
            </a>

            <a href="{% url 'accounts:change_password' %}">
                Change Password
            </a>
        </nav>
    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>
        <p>Django Practice Project</p>
    </footer>

</body>
</html>
